<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description"
        content="QuizForge - AI-powered revision and personalised quizzes.">

  <meta name="theme-color" content="#101322">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QuizForge">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>QuizForge</title>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js')
        .then(function (registration) {
          console.log('QuizForge service worker registered');
        })
        .catch(function (error) {
          console.error('Service worker registration failed:', error);
        });
    });
  }
</script>
</body>
</html>
